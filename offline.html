<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4e7c3">
<title>OpenRanch — Offline</title>
<style>
  :root { --bg:#fbf7ee; --card:#ffffff; --line:#e8dfc9; --text:#2b2a22; --dim:#6b6a5a;
          --accent:#d98a2b; --accent-ink:#9a5410; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:32px 26px; max-width:340px; text-align:center; }
  img { width:64px; height:64px; opacity:.85; margin-bottom:16px; }
  h1 { font-size:18px; margin-bottom:10px; }
  p { color:var(--dim); font-size:13px; line-height:1.55; }
  .warn { margin-top:18px; padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.5;
          background:rgba(255,107,53,.10); border:1px solid rgba(255,107,53,.35); color:#ffb492; }
  button { margin-top:20px; width:100%; padding:11px; border:0; border-radius:8px;
           background:var(--accent); color:#160800; font-family:inherit; font-weight:700;
           font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>No connection — device data unavailable</h1>
    <p>Your phone can't reach the OpenRanch server right now.</p>
    <div class="warn">Nothing on this screen reflects the current state of your
      devices. Readings are never shown from cache, so you are never looking at
      stale pump, valve, or sensor status.</div>
    <button onclick="location.replace('/')">Try again</button>
  </div>
</body>
</html>
